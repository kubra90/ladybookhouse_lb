name = "lady-bookhouse"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_SITE_URL = "https://theladybookhouse.com"

# Set these as secrets in the Cloudflare dashboard (not here):
# ADMIN_PASSWORD
# NEXTAUTH_SECRET
# NEXTAUTH_URL
# AOB_USERNAME
# AOB_PASSWORD
# STRIPE_SECRET_KEY
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
# STRIPE_WEBHOOK_SECRET
# FEATURED_BOOK_IDS  (comma-separated IDs, e.g. "1,4,8,10")
